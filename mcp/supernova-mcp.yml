description: >-
  Supernova ships Model Context Protocol (MCP) endpoints as part of its "Context
  Intelligence" layer — feeding AI coding and design agents scoped, governed context
  from a design system (design tokens, component APIs, documentation, and rules).
  The MCP endpoint is provisioned per workspace/context from the Supernova Portal;
  a "Contexts" governance layer (June 2026) controls exactly what an agent may read.

aid: supernova
name: Supernova
description: >-
  Supernova is an AI-powered platform for product teams that unifies design system
  management, documentation, code automation, and collaborative prototyping around a
  single source of truth for design tokens, components, and brand. Its "Context
  Intelligence" layer feeds AI coding and design agents scoped, governed context via
  Model Context Protocol (MCP) endpoints, while an official JS/TS SDK, a command-line
  interface, and an exporter framework let engineering teams automate design-to-code
  pipelines. Supernova is backed by EQT Ventures and serves enterprise teams with SOC 2,
  ISO 27001, GDPR, CCPA, and SSO/SCIM support.
